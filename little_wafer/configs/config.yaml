data:
  raw: "./Data/" 
  prr: "./Data/Output-PRR/"
  wafer_map_raw: "./Data/Wafer-Map/"
  wafer_map_png: "./Data/WaferMap_PNG/"
  real: "./Data/WaferMap_PNG/"
  train: "./Data/train/"
  val: "./Data/val_split/"
  test: "./Data/test_split/"
  npz_dataset: "./Data/Wafer_Map_Datasets.npz"
  auto_labeled: "./Data/AutoLabeled"
  augment_data: "./Data/Augmented_Real/"
  kaggle_png: "./Data/train/" 
  unlabeled_dataset: "./Data/unlabeled_dataset/"
  synthetis: "./Data/Synthetis/"
  synthetis_clean: "./Data/Synthetis_clean/"
  synthetic: "./Data/Synthetic"
  allowed_classes: ["center", "donut", "edge_ring", "scratch", "near_full", "loc", "edge_loc", "random","none"]

output:
  checkpoints: "./Output/checkpoints/"
  predictions: "./Output/predictions/"
  logs: "./Output/logs/"

model:
  device: "cuda"
  seed: 42

  model:
  resnet:
    epochs: 20
    batch_size: 32
    learning_rate: 0.0003
    optimizer: "adam"
    freeze_backbone: false  # ✅ แก้
    scheduler: "step"
    step_size: 7
    gamma: 0.1
    patience: 5
    save_best_only: true

  efficientnet:
    epochs: 20
    batch_size: 32
    learning_rate: 0.00005  # ✅ เพิ่มจาก 0.000005
    optimizer: "adamw"
    weight_decay: 0.01      # ✅ เพิ่ม
    freeze_backbone: false
    scheduler: "cosine"
    patience: 4
    save_best_only: true

  convnext:
    epochs: 10
    batch_size: 32
    learning_rate: 0.00005  # ✅ เพิ่มเล็กน้อย
    optimizer: "adamw"
    freeze_backbone: false
    scheduler: "cosine"
    weight_decay: 0.01
    patience: 4
    save_best_only: true

  vit:
    epochs: 10
    batch_size: 32
    learning_rate: 0.0001
    optimizer: "adamw"
    freeze_backbone: false  # ✅ แก้
    scheduler: "cosine"
    patience: 4
    save_best_only: true
    weight_decay: 0.01

training:
  warmup_epochs: 3       # ✅ เพิ่ม
  gradient_clip: 1.0     # ✅ เพิ่ม
  early_stopping: true
  patience: 5            # ✅ เพิ่มจาก 3
  save_best_only: true